name: MXW01 Bluetooth Printer
version: "0.2.1"
slug: mxw01_printer
description: Print Markdown, QR codes and remote images on an MXW01 Bluetooth thermal printer.
url: https://github.com/legion51/mxw01-printer-ha
arch:
  - aarch64
  - amd64
  - armv7
startup: application
init: false
host_dbus: true
ingress: true
ingress_port: 8099
ports:
  8099/tcp: null
options:
  device_address: ""
  device_name: "MXW01"
  auto_connect: true
  log_level: info
schema:
  device_address: str?
  device_name: str
  auto_connect: bool
  log_level: list(trace|debug|info|warning|error)
