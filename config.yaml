name: MXW01 Printer Terminal
version: "1.0.0"
slug: mxw01_printer
description: "Web-based terminal for MXW01/Lefuxin thermal printers via Web Bluetooth"
url: https://github.com/legion51/mxw01-printer
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:printer
panel_title: MXW01 Printer
host_dbus: true
host_network: true
privileged: true
hassio_api: true
homeassistant_api: true
homeassistant: 2024.1.0
options:
  server_port: 8099
  enable_proxy: true
  cors_allow_origin: "*"
  debug: false
  auto_connect: false
schema:
  server_port: int(1024,65535)
  enable_proxy: bool
  cors_allow_origin: str
  debug: bool
  auto_connect: bool
webui: "http://[HOST]:[PORT:8099]"
map:
  - share:rw
  - ssl:ro