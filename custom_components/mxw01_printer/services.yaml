print:
  name: Print
  description: Render text, QR codes and remote images and print them on the MXW01.
  fields:
    markdown:
      name: Content
      description: "Text markup. Supports # heading, [C] centered text, [QR:text|size], [IMG:https://...|percent], --- and ===."
      required: true
      example: "# Receipt\n[C]Thank you\n[QR:https://example.org|4]"
      selector:
        text:
          multiline: true
    font_size:
      name: Font size
      selector:
        number:
          min: 10
          max: 40
          mode: slider
    qr_size:
      name: QR module size
      selector:
        number:
          min: 1
          max: 10
          mode: slider
    image_scale:
      name: Image scale, percent
      selector:
        number:
          min: 20
          max: 200
          mode: slider
    device_address:
      name: Bluetooth address
      description: Optional override of the configured printer address.
      selector:
        text:
